# 社内 PC（192.168.40.150）の WSL2「Ubuntu-24.04」用。/opt/daylogs に置く。
# 同じ場所の .env に TAG（使うイメージ daylogs:<TAG>）・TRAGGO_DEFAULT_USER_NAME・TRAGGO_DEFAULT_USER_PASS を書く。
# WSL はミラーモード（.wslconfig の networkingMode=mirrored）なので、3030 番は Windows の IP でそのまま受ける。
services:
  traggo:
    image: daylogs:${TAG}
    restart: unless-stopped
    environment:
      TRAGGO_DEFAULT_USER_NAME: ${TRAGGO_DEFAULT_USER_NAME}
      TRAGGO_DEFAULT_USER_PASS: ${TRAGGO_DEFAULT_USER_PASS}
      TRAGGO_LOG_LEVEL: info
    ports:
      - 3030:3030
    volumes:
      - ./data:/opt/traggo/data
